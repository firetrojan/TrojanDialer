# Gradle JVM settings. AGP 8.13 requires JDK 17.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required for Jetpack libraries (androidx.*) on AGP 8.
android.useAndroidX=true

# Kotlin 2.x is incompatible with legacy languageVersion defaults on AGP 8.13.
kotlin.code.style=official
