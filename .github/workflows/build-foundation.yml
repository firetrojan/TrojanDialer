name: Build

# Real build gate. One job, ordered so that the cheapest failure surfaces first
# and every later step is meaningful only if the earlier ones passed.
#
# The distinction that matters here: `gradle projects` succeeding proves only
# that build scripts can be evaluated. It does not prove the app compiles, and
# it is not reported as a pass.
#
# Every step below either succeeds or fails on its own exit code. Nothing uses
# continue-on-error to fake progress; if a step is allowed to fail, the gate
# checks its recorded result explicitly and says so.

on:
  push:
    branches: [main, master, Working]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_ARGS: --stacktrace --warning-mode=summary

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    # Android build tools are published for x86_64 only, so the full assemble
    # cannot run anywhere else. Nothing here is ARM64-capable.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # Every module's build script must evaluate before anything else means
      # anything. This is cheap and fails fast.
      - name: Configure
        id: config
        run: ./gradlew projects $GRADLE_ARGS

      # Dependency resolution across every module, not just :app. Catches a
      # coordinate or version that cannot be fetched before compilation starts.
      - name: Resolve dependencies
        id: deps
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath $GRADLE_ARGS

      # Compile every module's Kotlin. :data:core alone proved nothing about
      # the other 25 modules; this is the first step that does.
      - name: Compile all modules
        id: compile
        run: ./gradlew compileDebugKotlin $GRADLE_ARGS

      # The strongest signal available on any supported host: resource merging,
      # AAPT2, packaging and manifest verification all run here.
      - name: Assemble debug APK
        id: assemble
        run: ./gradlew :app:assembleDebug $GRADLE_ARGS

      # Only meaningful once the modules compile.
      - name: Unit tests
        id: test
        run: ./gradlew testDebugUnitTest $GRADLE_ARGS

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      # Written with a quoted heredoc so nothing in the body is interpreted as
      # shell: no backticks, no command substitution, no escaped quoting. The
      # earlier version used an unescaped backtick inside a double-quoted echo,
      # which made bash read the rest of the step as a command substitution and
      # exit 2.
      - name: Summary
        if: always()
        env:
          R_CONFIG: ${{ steps.config.outcome }}
          R_DEPS: ${{ steps.deps.outcome }}
          R_COMPILE: ${{ steps.compile.outcome }}
          R_ASSEMBLE: ${{ steps.assemble.outcome }}
          R_TEST: ${{ steps.test.outcome }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          {
            printf '### Build result\n\n'
            printf 'Commit `%s`\n\n' "$HEAD_SHA"
            printf '| Step | Result |\n'
            printf '|------|--------|\n'
            printf '| Configure | %s |\n' "${R_CONFIG:-skipped}"
            printf '| Dependencies | %s |\n' "${R_DEPS:-skipped}"
            printf '| Compile all modules | %s |\n' "${R_COMPILE:-skipped}"
            printf '| Assemble debug APK | %s |\n' "${R_ASSEMBLE:-skipped}"
            printf '| Unit tests | %s |\n' "${R_TEST:-skipped}"
            printf '\n'

            if [ "${R_CONFIG:-skipped}" != "success" ]; then
              printf '**Configuration failed.** No build script could be evaluated.\n'
            elif [ "${R_DEPS:-skipped}" != "success" ]; then
              printf '**Configuration OK, dependency resolution failed.** Compilation was not attempted.\n'
            elif [ "${R_COMPILE:-skipped}" != "success" ]; then
              printf '**Compilation failed.** Module errors are in the job log.\n'
            elif [ "${R_ASSEMBLE:-skipped}" != "success" ]; then
              printf '**All modules compiled, but the APK did not assemble.**\n'
            elif [ "${R_TEST:-skipped}" != "success" ]; then
              printf '**APK assembled. Tests failed** - see the job log.\n'
            else
              printf '**APK assembled and tests passed.** This proves the artifact is\n'
              printf 'packable, not that it runs on a device.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate. A green run means all five stages really passed; nothing is
      # skipped silently.
      - name: Gate
        if: always()
        env:
          R_CONFIG: ${{ steps.config.outcome }}
          R_DEPS: ${{ steps.deps.outcome }}
          R_COMPILE: ${{ steps.compile.outcome }}
          R_ASSEMBLE: ${{ steps.assemble.outcome }}
          R_TEST: ${{ steps.test.outcome }}
        run: |
          failed=0
          for pair in \
            "configure:${R_CONFIG:-skipped}" \
            "dependencies:${R_DEPS:-skipped}" \
            "compile:${R_COMPILE:-skipped}" \
            "assemble:${R_ASSEMBLE:-skipped}" \
            "test:${R_TEST:-skipped}"
          do
            stage="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ]; then
              printf '::error::%s did not pass (%s)' "$stage" "$result"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            printf '::error::build gate failed'
            exit 1
          fi
          printf 'build gate passed'
